<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - Internal Server Error</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  
  <style>
    /* Custom styles for centering and cuteness */
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background-color: var(--pico-background-color);
    }

    .error-creature {
      font-size: 5rem;
      margin-bottom: 0;
      display: inline-block; /* Required so the rotation animation works on the emoji */
      /* Adds a gentle dizzy wobble effect */
      animation: dizzy 2s ease-in-out infinite; 
    }

    @keyframes dizzy {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      75% { transform: rotate(12deg); }
    }

    h1 {
      font-size: 3rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--pico-muted-color);
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    /* Make the button a little softer */
    .pico-btn {
      border-radius: 2rem;
      padding: 0.75rem 2rem;
    }
  </style>
</head>
<body>

  <main class="container">
    <article style="background: transparent; border: none; box-shadow: none;">
      <div class="error-creature">🤖</div>
      <h1>Yikes! 500</h1>
      <p>Oh no! Our little server robot blew a fuse. We are working hard to fix it.</p>
      <a href="/" role="button" class="pico-btn secondary">Retreat to safety</a>
    </article>
  </main>

</body>
</html>
